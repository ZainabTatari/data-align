# Ollama runs directly on your computer (not in Docker), so Windows can use the GPU.
# Containers reach it at http://host.docker.internal:11434
services:
  langflow:
    image: langflowai/langflow:latest
    ports: ["7860:7860"]
    environment:
      # Local demo login. Change the password if others can reach your computer.
      LANGFLOW_SUPERUSER: admin
      LANGFLOW_SUPERUSER_PASSWORD: DataAlign-Local-2026
    volumes:
      - ./templates:/app/templates:ro
      - langflow_data:/app/langflow
  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ["3000:3000"]
  postgres:            # demo databases with deliberate defects
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password_change_me
      POSTGRES_DB: demo
    ports: ["5432:5432"]
    volumes:
      - ./test-data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  langflow_data:
